<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" role="img" aria-labelledby="title desc">
  <title id="title">Allele dosage concept</title>
  <desc id="desc">Five dosage states from zero to four copies in a tetraploid locus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef7f8"/><stop offset="1" stop-color="#f3faf4"/></linearGradient>
  </defs>
  <rect width="800" height="425" rx="28" fill="url(#bg)"/>
  <text x="52" y="72" fill="#2A6576" font-family="Arial, sans-serif" font-size="25" font-weight="700">ALLELE DOSAGE</text>
  <text x="52" y="110" fill="#434544" font-family="Arial, sans-serif" font-size="18">Copies of the B allele at a tetraploid locus</text>
  <g transform="translate(52 165)">
    <g transform="translate(0)"><rect width="126" height="150" rx="18" fill="#fff" stroke="#B5DDE8" stroke-width="3"/><text x="63" y="42" text-anchor="middle" fill="#2A6576" font-family="Arial" font-size="25" font-weight="700">0</text><text x="63" y="83" text-anchor="middle" fill="#434544" font-family="monospace" font-size="24">AAAA</text><text x="63" y="119" text-anchor="middle" fill="#707372" font-family="Arial" font-size="14">0 / 4 B copies</text></g>
    <g transform="translate(142)"><rect width="126" height="150" rx="18" fill="#fff" stroke="#B5DDE8" stroke-width="3"/><text x="63" y="42" text-anchor="middle" fill="#2A6576" font-family="Arial" font-size="25" font-weight="700">1</text><text x="63" y="83" text-anchor="middle" fill="#434544" font-family="monospace" font-size="24">AAAB</text><text x="63" y="119" text-anchor="middle" fill="#707372" font-family="Arial" font-size="14">1 / 4 B copies</text></g>
    <g transform="translate(284)"><rect width="126" height="150" rx="18" fill="#fff" stroke="#A3D9AC" stroke-width="3"/><text x="63" y="42" text-anchor="middle" fill="#1E5D28" font-family="Arial" font-size="25" font-weight="700">2</text><text x="63" y="83" text-anchor="middle" fill="#434544" font-family="monospace" font-size="24">AABB</text><text x="63" y="119" text-anchor="middle" fill="#707372" font-family="Arial" font-size="14">2 / 4 B copies</text></g>
    <g transform="translate(426)"><rect width="126" height="150" rx="18" fill="#fff" stroke="#A3D9AC" stroke-width="3"/><text x="63" y="42" text-anchor="middle" fill="#1E5D28" font-family="Arial" font-size="25" font-weight="700">3</text><text x="63" y="83" text-anchor="middle" fill="#434544" font-family="monospace" font-size="24">ABBB</text><text x="63" y="119" text-anchor="middle" fill="#707372" font-family="Arial" font-size="14">3 / 4 B copies</text></g>
    <g transform="translate(568)"><rect width="126" height="150" rx="18" fill="#fff" stroke="#A3D9AC" stroke-width="3"/><text x="63" y="42" text-anchor="middle" fill="#1E5D28" font-family="Arial" font-size="25" font-weight="700">4</text><text x="63" y="83" text-anchor="middle" fill="#434544" font-family="monospace" font-size="24">BBBB</text><text x="63" y="119" text-anchor="middle" fill="#707372" font-family="Arial" font-size="14">4 / 4 B copies</text></g>
  </g>
</svg>
