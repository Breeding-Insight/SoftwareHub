<script>
(() => {
  const FACETS = ["type", "topic", "software", "level"];
  const FACET_ORDER = {
    type: ["Concept", "Guide", "Tutorial", "Workflow"],
    topic: [
      "Getting Started",
      "Genotype Data",
      "Data Quality",
      "Ploidy & Dosage",
      "File Formats",
      "Population Analysis",
      "Trait Mapping",
      "Genomic Prediction"
    ],
    software: ["BIGr", "BIGapp", "Qploidy2", "Familia", "AlloMate", "BIGpopA"],
    level: ["Beginner", "Intermediate", "Advanced"]
  };
  const LISTING_ANCHOR = "all-learning-materials";
  const SEARCH_PARAM = "learn-q";

  const state = {
    filters: new Map(FACETS.map((facet) => [facet, new Set()])),
    query: ""
  };

  let cards = [];
  let searchInput;
  let clearButton;
  let resultCount;
  let noResults;

  function decodeValues(card, facet) {
    try {
      return JSON.parse(decodeURIComponent(card.dataset[`learn${facet[0].toUpperCase()}${facet.slice(1)}`] || "%5B%5D"));
    } catch (_error) {
      return [];
    }
  }

  function sortValues(facet, values) {
    const preferred = FACET_ORDER[facet] || [];
    return [...values].sort((a, b) => {
      const aIndex = preferred.indexOf(a);
      const bIndex = preferred.indexOf(b);
      if (aIndex !== -1 || bIndex !== -1) {
        if (aIndex === -1) return 1;
        if (bIndex === -1) return -1;
        return aIndex - bIndex;
      }
      return a.localeCompare(b);
    });
  }

  // Sidebar checkboxes, built once; syncControls updates their state and counts in place.
  function buildFacetControls() {
    for (const facet of FACETS) {
      const container = document.querySelector(`[data-filter-options="${facet}"]`);
      if (!container) continue;

      const values = new Set(cards.flatMap((card) => decodeValues(card, facet)));
      for (const value of sortValues(facet, values)) {
        const label = document.createElement("label");
        label.className = "hub-option";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.facet = facet;
        input.value = value;
        const name = document.createElement("span");
        name.className = "hub-option-name";
        name.textContent = value;
        const count = document.createElement("span");
        count.className = "hub-count";
        label.append(input, name, count);
        container.append(label);
      }
    }
  }

  function normalize(value) {
    return value.toLocaleLowerCase().replace(/\s+/g, " ").trim();
  }

  // ignoreFacet leaves one facet out, so option counts show what checking it would give.
  function cardMatches(card, ignoreFacet) {
    for (const facet of FACETS) {
      if (facet === ignoreFacet) continue;
      const selected = state.filters.get(facet);
      if (!selected.size) continue;
      const values = decodeValues(card, facet);
      if (!values.some((value) => selected.has(value))) return false;
    }

    const terms = normalize(state.query).split(" ").filter(Boolean);
    if (!terms.length) return true;

    let cardText = "";
    try {
      cardText = decodeURIComponent(card.dataset.learnSearch || "");
    } catch (_error) {
      cardText = card.textContent || "";
    }
    const normalizedCardText = normalize(cardText);
    return terms.every((term) => normalizedCardText.includes(term));
  }

  function activeFilterCount() {
    return FACETS.reduce((total, facet) => total + state.filters.get(facet).size, 0) + (state.query.trim() ? 1 : 0);
  }

  function syncControls() {
    for (const facet of FACETS) {
      const selected = state.filters.get(facet);
      const pool = cards.filter((card) => cardMatches(card, facet));
      document.querySelectorAll(`input[data-facet="${facet}"]`).forEach((input) => {
        const count = pool.filter((card) => decodeValues(card, facet).includes(input.value)).length;
        input.checked = selected.has(input.value);
        input.disabled = count === 0 && !input.checked;
        const label = input.closest(".hub-option");
        label.classList.toggle("is-empty", input.disabled);
        label.querySelector(".hub-count").textContent = count;
      });
      const summary = document.querySelector(`[data-learn-facet="${facet}"] > summary .hub-facet-selected`);
      if (summary) summary.textContent = selected.size ? `${selected.size} selected` : "";
    }

    document.querySelectorAll(".learn-listing-card .hub-tag").forEach((button) => {
      const pressed = state.filters.get(button.dataset.facet)?.has(button.dataset.value) || false;
      button.setAttribute("aria-pressed", String(pressed));
    });
    if (searchInput && searchInput.value !== state.query) searchInput.value = state.query;

    const toggleCount = document.getElementById("hub-filter-toggle-count");
    const active = activeFilterCount();
    if (toggleCount) toggleCount.textContent = active ? `(${active})` : "";
  }

  function applyFilters() {
    let visible = 0;
    for (const card of cards) {
      const matches = cardMatches(card);
      card.hidden = !matches;
      if (matches) visible += 1;
    }

    if (resultCount) {
      resultCount.textContent = `${visible} ${visible === 1 ? "learning material" : "learning materials"}`;
    }
    if (noResults) noResults.hidden = visible !== 0;
    if (clearButton) clearButton.hidden = activeFilterCount() === 0;
    syncControls();
  }

  function writeUrl(historyMethod = "replaceState", includeAnchor = false) {
    const url = new URL(window.location.href);
    for (const facet of FACETS) {
      url.searchParams.delete(facet);
      for (const value of sortValues(facet, state.filters.get(facet))) {
        url.searchParams.append(facet, value);
      }
    }
    url.searchParams.delete(SEARCH_PARAM);
    url.searchParams.delete("q");
    url.searchParams.delete("filter");
    if (state.query.trim()) url.searchParams.set(SEARCH_PARAM, state.query.trim());
    if (includeAnchor) url.hash = LISTING_ANCHOR;
    window.history[historyMethod]({}, "", url);
  }

  function readUrl() {
    const params = new URLSearchParams(window.location.search);
    const available = new Map(FACETS.map((facet) => [
      facet,
      new Set(cards.flatMap((card) => decodeValues(card, facet)))
    ]));

    for (const facet of FACETS) {
      const selected = new Set(
        params.getAll(facet).filter((value) => available.get(facet).has(value))
      );
      state.filters.set(facet, selected);
    }
    state.query = params.get(SEARCH_PARAM) || params.get("q") || "";
  }

  function clearState() {
    for (const facet of FACETS) state.filters.get(facet).clear();
    state.query = "";
  }

  function openFacet(facet) {
    const details = document.querySelector(`[data-learn-facet="${facet}"]`);
    if (details) details.open = true;
  }

  function scrollToListing() {
    document.getElementById(LISTING_ANCHOR)?.scrollIntoView({
      behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
      block: "start"
    });
  }

  function syncStickyOffset() {
    const header = document.getElementById("quarto-header");
    const height = header ? header.getBoundingClientRect().height : 0;
    document.documentElement.style.setProperty("--hub-header-height", `${Math.round(height)}px`);
  }

  document.addEventListener("DOMContentLoaded", () => {
    cards = [...document.querySelectorAll(".learn-listing-card")];
    searchInput = document.getElementById("learn-material-search");
    clearButton = document.getElementById("learn-clear-filters");
    resultCount = document.getElementById("learn-result-count");
    noResults = document.getElementById("learn-no-results");
    if (!cards.length || !searchInput) return;

    buildFacetControls();
    readUrl();
    for (const facet of FACETS) {
      if (state.filters.get(facet).size) openFacet(facet);
    }
    applyFilters();

    document.getElementById("hub-filter-panel")?.addEventListener("change", (event) => {
      const input = event.target.closest("input[data-facet]");
      if (!input) return;
      const selected = state.filters.get(input.dataset.facet);
      if (input.checked) selected.add(input.value);
      else selected.delete(input.value);
      writeUrl("pushState");
      applyFilters();
    });

    document.addEventListener("click", (event) => {
      // Topic tags on a card toggle that topic, like tags on the Software page.
      const tag = event.target.closest(".learn-listing-card .hub-tag");
      if (tag) {
        const selected = state.filters.get(tag.dataset.facet);
        if (selected.has(tag.dataset.value)) selected.delete(tag.dataset.value);
        else {
          selected.add(tag.dataset.value);
          openFacet(tag.dataset.facet);
        }
        writeUrl("pushState");
        applyFilters();
        return;
      }

      const trigger = event.target.closest(".learn-filter-trigger");
      if (trigger) {
        event.preventDefault();
        clearState();
        state.filters.get(trigger.dataset.setFacet)?.add(trigger.dataset.setValue);
        openFacet(trigger.dataset.setFacet);
        writeUrl("pushState", true);
        applyFilters();
        scrollToListing();
      }
    });

    searchInput.addEventListener("input", () => {
      state.query = searchInput.value;
      writeUrl("replaceState");
      applyFilters();
    });

    clearButton?.addEventListener("click", () => {
      clearState();
      writeUrl("pushState");
      applyFilters();
      searchInput.focus();
    });

    const toggle = document.getElementById("hub-filter-toggle");
    toggle?.addEventListener("click", () => {
      const open = toggle.getAttribute("aria-expanded") !== "true";
      toggle.setAttribute("aria-expanded", String(open));
      document.getElementById("hub-filter-panel").classList.toggle("is-open", open);
    });

    syncStickyOffset();
    window.addEventListener("resize", syncStickyOffset);

    window.addEventListener("popstate", () => {
      readUrl();
      applyFilters();
    });
  });
})();
</script>
