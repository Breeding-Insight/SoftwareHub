project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "software/*.qmd"
    - "learn/*.qmd"
    - "news/*.qmd"
    - "workshops/**/*.qmd"
    - "!workshops/*-template.qmd"
  resources:
    - "workshops/bigapp/data/**"
    - "workshops/bigapp/images/**"

website:
  title: "Breeding Insight Software"
  site-url: "https://breeding-insight.github.io/SoftwareHub/"
  description: "Software, tutorials, workshops, and documentation from Breeding Insight."
  favicon: assets/bi-mark.png
  open-graph: true
  # Google Analytics 4 (UF's standard). Uncomment and set the Measurement ID from the GA4 data
  # stream (Admin > Data streams). "Use online" clicks are sent as a use_online event by
  # assets/analytics-events.html. cookie-consent shows Quarto's notice; "implied" keeps
  # tracking on unless the visitor opts out.
  # google-analytics: "G-XXXXXXXXXX"
  # cookie-consent:
  #   type: implied
  #   style: simple
  #   palette: light
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
    limit: 30
  navbar:
    pinned: true
    title: "SoftwareHub"
    logo: assets/breeding-insight-wordmark.png
    logo-alt: "Breeding Insight"
    logo-href: https://breedinginsight.org/
    left:
      - text: Software
        href: software.qmd
      - text: Learn
        href: learn.qmd
      - text: Workshops
        href: workshops.qmd
      - text: Resources
        href: resources.qmd
      - text: News
        href: news.qmd
    right:
      - icon: github
        href: https://github.com/Breeding-Insight
        aria-label: Breeding Insight on GitHub
      - text: Breeding Insight
        href: https://breedinginsight.org/
  sidebar:
    - id: bigapp-workshop
      title: "BIGapp workshop"
      style: docked
      collapse-level: 1
      contents:
        - text: "Workshop overview"
          href: workshops/bigapp/index.qmd
        - text: "Required local setup"
          href: workshops/bigapp/setup.qmd
        - text: "1. Data quality control"
          href: workshops/bigapp/data-quality-control.qmd
        - text: "2. Population structure and PCA"
          href: workshops/bigapp/pca.qmd
        - text: "3. GWASpoly"
          href: workshops/bigapp/gwas.qmd
        - text: "4. Genomic selection (optional)"
          href: workshops/bigapp/genomic-selection.qmd
        - text: "Dataset guide"
          href: workshops/bigapp/dataset-guide.qmd
  page-footer:
    left: |
      <div class="footer-partners">
      <ul class="footer-partner-logos" aria-label="Partner organizations">
      <li><a href="https://breedinginsight.org/"><span class="footer-logo footer-logo-bi" aria-hidden="true"></span><span class="visually-hidden">Breeding Insight</span></a></li>
      <li><a href="https://www.ars.usda.gov/"><span class="footer-logo footer-logo-usda" aria-hidden="true"></span><span class="visually-hidden">USDA Agricultural Research Service</span></a></li>
      <li><a href="https://ifas.ufl.edu/"><span class="footer-logo footer-logo-ifas" aria-hidden="true"></span><span class="visually-hidden">University of Florida Institute of Food and Agricultural Sciences</span></a></li>
      <li><a href="https://www.cornell.edu/"><span class="footer-logo footer-logo-cornell" aria-hidden="true"></span><span class="visually-hidden">Cornell University</span></a></li>
      </ul>
      <div class="footer-funding-copy">Funded by USDA-ARS through the University of Florida (UF/IFAS)</div>
      </div>
    center:
      - text: GitHub
        href: https://github.com/Breeding-Insight
      - text: Main website
        href: https://breedinginsight.org/
    right: |
      <div class="footer-copyright">&copy; 2026 Breeding Insight</div>
  repo-url: https://github.com/Breeding-Insight/SoftwareHub
  repo-actions: [edit, issue]

format:
  html:
    theme: [cosmo, styles.scss]
    include-in-header:
      - assets/analytics-events.html
      - assets/navbar-brand.html
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    canonical-url: true
    date-format: "MMMM D, YYYY"

execute:
  freeze: auto
