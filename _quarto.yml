project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "software/*.qmd"
    - "learn/*.qmd"
    - "news/*.qmd"
    - "workshops/**/*.qmd"
    - "!workshops/*-template.qmd"
  resources:
    - "workshops/bigapp/data/**"
    - "workshops/bigapp/images/**"

website:
  title: "Breeding Insight Software"
  site-url: "https://breeding-insight.github.io/SoftwareHub/"
  description: "Software, tutorials, workshops, and documentation from Breeding Insight."
  favicon: assets/bi-mark.png
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
    limit: 30
  navbar:
    pinned: true
    logo: assets/breeding-insight.png
    logo-alt: "Breeding Insight"
    left:
      - text: Software
        href: software.qmd
      - text: Learn
        href: learn.qmd
      - text: Workshops
        href: workshops.qmd
      - text: Resources
        href: resources.qmd
      - text: News
        href: news.qmd
    right:
      - icon: github
        href: https://github.com/Breeding-Insight
        aria-label: Breeding Insight on GitHub
      - text: Breeding Insight
        href: https://breedinginsight.org/
  sidebar:
    - id: bigapp-workshop
      title: "BIGapp workshop"
      style: docked
      collapse-level: 1
      contents:
        - text: "Workshop overview"
          href: workshops/bigapp/index.qmd
        - text: "Required local setup"
          href: workshops/bigapp/setup.qmd
        - text: "1. Data quality control"
          href: workshops/bigapp/data-quality-control.qmd
        - text: "2. Population structure and PCA"
          href: workshops/bigapp/pca.qmd
        - text: "3. GWASpoly"
          href: workshops/bigapp/gwas.qmd
        - text: "4. Genomic selection (optional)"
          href: workshops/bigapp/genomic-selection.qmd
        - text: "Dataset guide"
          href: workshops/bigapp/dataset-guide.qmd
  page-footer:
    left: |
      <div class="footer-identity">
      <img class="footer-identity-mark" src="assets/bi-mark.png" alt="">
      <div class="footer-identity-text">
      <div class="footer-identity-name">Breeding Insight</div>
      <div class="footer-identity-copy">&copy; 2026 Breeding Insight</div>
      </div>
      </div>
    center:
      - text: GitHub
        href: https://github.com/Breeding-Insight
      - text: Main website
        href: https://breedinginsight.org/
    right: |
      <div class="footer-funding">
      <p class="footer-funding-copy">Funded by USDA-ARS through the University of Florida (UF/IFAS)</p>
      <div class="footer-funding-logos">
      <a href="https://www.ars.usda.gov/"><img class="footer-logo footer-logo-usda" src="assets/funder-usda.png" alt="USDA Agricultural Research Service"></a>
      <a href="https://ifas.ufl.edu/"><img class="footer-logo footer-logo-ifas" src="assets/funder-uf-ifas.png" alt="University of Florida Institute of Food and Agricultural Sciences"></a>
      <a href="https://www.cornell.edu/"><img class="footer-logo footer-logo-cornell" src="assets/funder-cornell.png" alt="Cornell University"></a>
      </div>
      </div>
  repo-url: https://github.com/Breeding-Insight/SoftwareHub
  repo-actions: [edit, issue]

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    canonical-url: true
    date-format: "MMMM D, YYYY"

execute:
  freeze: auto
