<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" role="img" aria-labelledby="title desc">
  <title id="title">MADC file concept</title>
  <desc id="desc">A table of fixed allele identifiers, marker identifiers, and read counts for two samples. A side panel emphasizes that the values are read counts rather than genotype calls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#EEF7F8"/>
      <stop offset="1" stop-color="#F3FAF4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="425" rx="28" fill="url(#bg)"/>
  <circle cx="735" cy="42" r="118" fill="#48A9C5" opacity=".08"/>
  <circle cx="70" cy="418" r="125" fill="#A3D9AC" opacity=".10"/>

  <text x="52" y="70" fill="#2A6576" font-family="Arial, sans-serif" font-size="25" font-weight="700">MADC FILE</text>
  <text x="52" y="108" fill="#434544" font-family="Arial, sans-serif" font-size="18">Microhaplotype evidence organized by sample</text>

  <g transform="translate(52 145)">
    <rect width="500" height="214" rx="16" fill="#FFFFFF" stroke="#B5DDE8" stroke-width="2"/>
    <path d="M0 46H500" stroke="#B5DDE8" stroke-width="2"/>
    <path d="M0 102H500M0 158H500" stroke="#D9E8EB" stroke-width="1.5"/>
    <path d="M164 0V214M322 0V214M410 0V214" stroke="#D9E8EB" stroke-width="1.5"/>

    <rect x="1" y="1" width="498" height="45" rx="15" fill="#E8F3F5"/>
    <rect x="1" y="31" width="498" height="15" fill="#E8F3F5"/>

    <g fill="#2A6576" font-family="Arial, sans-serif" font-size="14" font-weight="700">
      <text x="16" y="29">AlleleID</text>
      <text x="180" y="29">CloneID</text>
      <text x="337" y="29">Sample 1</text>
      <text x="425" y="29">Sample 2</text>
    </g>

    <g font-family="Arial, sans-serif" font-size="15">
      <text x="16" y="81" fill="#1E5D28" font-weight="700">Ref_0001</text>
      <text x="180" y="81" fill="#434544">marker_01</text>
      <text x="366" y="81" text-anchor="middle" fill="#434544">152</text>
      <text x="454" y="81" text-anchor="middle" fill="#434544">171</text>

      <text x="16" y="137" fill="#765C9E" font-weight="700">Alt_0002</text>
      <text x="180" y="137" fill="#434544">marker_01</text>
      <text x="366" y="137" text-anchor="middle" fill="#434544">44</text>
      <text x="454" y="137" text-anchor="middle" fill="#434544">1</text>

      <text x="16" y="193" fill="#2A6576" font-weight="700">RefMatch_0001</text>
      <text x="180" y="193" fill="#434544">marker_02</text>
      <text x="366" y="193" text-anchor="middle" fill="#434544">43</text>
      <text x="454" y="193" text-anchor="middle" fill="#434544">82</text>
    </g>
  </g>

  <g transform="translate(582 154)">
    <rect width="166" height="196" rx="18" fill="#FFFFFF" stroke="#A3D9AC" stroke-width="2"/>
    <text x="83" y="32" text-anchor="middle" fill="#1E5D28" font-family="Arial, sans-serif" font-size="13" font-weight="700">WHAT IT STORES</text>

    <g transform="translate(29 54)">
      <circle cx="12" cy="12" r="12" fill="#48A9C5"/>
      <circle cx="42" cy="12" r="12" fill="#A3D9AC"/>
      <circle cx="72" cy="12" r="12" fill="#765C9E"/>
      <circle cx="102" cy="12" r="12" fill="#F1C56C"/>
      <path d="M12 40H102" stroke="#B5DDE8" stroke-width="4" stroke-linecap="round"/>
      <path d="M32 51H82" stroke="#A3D9AC" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="83" y="128" text-anchor="middle" fill="#434544" font-family="Arial, sans-serif" font-size="16" font-weight="700">Read counts</text>
    <rect x="25" y="146" width="116" height="30" rx="15" fill="#FFF7E8" stroke="#E1B459"/>
    <text x="83" y="166" text-anchor="middle" fill="#674615" font-family="Arial, sans-serif" font-size="13" font-weight="700">not genotype calls</text>
  </g>
</svg>
