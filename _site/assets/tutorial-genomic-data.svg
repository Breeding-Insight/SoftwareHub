<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">VCF basics</title>
  <desc id="description">A simplified VCF table beside a read-depth bar chart.</desc>
  <rect width="1200" height="675" fill="#F4F8F8"/>
  <circle cx="1060" cy="75" r="250" fill="#48A9C5" opacity=".12"/>
  <circle cx="110" cy="650" r="260" fill="#A3D9AC" opacity=".15"/>
  <text x="90" y="120" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#2A6576">VCF basics</text>
  <g transform="translate(90 175)">
    <rect width="650" height="355" rx="24" fill="#FFFFFF" stroke="#B5DDE8" stroke-width="5"/>
    <rect width="650" height="70" rx="24" fill="#2A6576"/>
    <path d="M0 70H650" stroke="#2A6576" stroke-width="3"/>
    <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">
      <text x="32" y="45">CHROM</text><text x="180" y="45">POS</text><text x="280" y="45">REF</text><text x="380" y="45">ALT</text><text x="480" y="45">FORMAT</text>
    </g>
    <g stroke="#D8E8E8" stroke-width="3">
      <path d="M0 142H650M0 213H650M0 284H650"/>
      <path d="M150 70V355M250 70V355M350 70V355M450 70V355"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="23" fill="#434544">
      <text x="32" y="116">Chr1</text><text x="180" y="116">10</text><text x="290" y="116">A</text><text x="390" y="116">B</text><text x="475" y="116">GT:DP</text>
      <text x="32" y="187">Chr1</text><text x="172" y="187">100</text><text x="290" y="187">A</text><text x="390" y="187">B</text><text x="475" y="187">GT:DP</text>
      <text x="32" y="258">Chr4</text><text x="172" y="258">810</text><text x="290" y="258">A</text><text x="390" y="258">B</text><text x="475" y="258">GT:DP</text>
      <text x="32" y="329">Chr8</text><text x="172" y="329">920</text><text x="290" y="329">A</text><text x="390" y="329">B</text><text x="475" y="329">GT:DP</text>
    </g>
  </g>
  <g transform="translate(805 205)">
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1E5D28">Read depth</text>
    <path d="M0 300H300M0 0V300" stroke="#707372" stroke-width="4"/>
    <g fill="#48A9C5">
      <rect x="20" y="70" width="35" height="230" rx="5"/>
      <rect x="67" y="25" width="35" height="275" rx="5"/>
      <rect x="114" y="105" width="35" height="195" rx="5"/>
      <rect x="161" y="155" width="35" height="145" rx="5"/>
      <rect x="208" y="210" width="35" height="90" rx="5"/>
      <rect x="255" y="245" width="35" height="55" rx="5"/>
    </g>
  </g>
</svg>
