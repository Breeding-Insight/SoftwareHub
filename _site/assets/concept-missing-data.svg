<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" role="img" aria-labelledby="title desc">
  <title id="title">Missing data threshold concept</title>
  <desc id="desc">A genotype matrix with missing cells and a threshold slider.</desc>
  <rect width="800" height="425" rx="28" fill="#F4F8F8"/>
  <text x="52" y="70" fill="#2A6576" font-family="Arial" font-size="25" font-weight="700">MISSING DATA</text>
  <text x="52" y="108" fill="#434544" font-family="Arial" font-size="18">Choose a threshold by analysis goal, not habit</text>
  <g transform="translate(56 150)">
    <g fill="#fff" stroke="#B5DDE8" stroke-width="2">
      <rect x="0" y="0" width="52" height="42" rx="6"/><rect x="60" y="0" width="52" height="42" rx="6"/><rect x="120" y="0" width="52" height="42" rx="6"/><rect x="180" y="0" width="52" height="42" rx="6"/><rect x="240" y="0" width="52" height="42" rx="6"/>
      <rect x="0" y="50" width="52" height="42" rx="6"/><rect x="60" y="50" width="52" height="42" rx="6"/><rect x="120" y="50" width="52" height="42" rx="6"/><rect x="180" y="50" width="52" height="42" rx="6"/><rect x="240" y="50" width="52" height="42" rx="6"/>
      <rect x="0" y="100" width="52" height="42" rx="6"/><rect x="60" y="100" width="52" height="42" rx="6"/><rect x="120" y="100" width="52" height="42" rx="6"/><rect x="180" y="100" width="52" height="42" rx="6"/><rect x="240" y="100" width="52" height="42" rx="6"/>
      <rect x="0" y="150" width="52" height="42" rx="6"/><rect x="60" y="150" width="52" height="42" rx="6"/><rect x="120" y="150" width="52" height="42" rx="6"/><rect x="180" y="150" width="52" height="42" rx="6"/><rect x="240" y="150" width="52" height="42" rx="6"/>
    </g>
    <g fill="#A3D9AC"><rect x="8" y="8" width="36" height="26" rx="4"/><rect x="68" y="8" width="36" height="26" rx="4"/><rect x="188" y="8" width="36" height="26" rx="4"/><rect x="248" y="8" width="36" height="26" rx="4"/><rect x="8" y="58" width="36" height="26" rx="4"/><rect x="128" y="58" width="36" height="26" rx="4"/><rect x="188" y="58" width="36" height="26" rx="4"/><rect x="68" y="108" width="36" height="26" rx="4"/><rect x="128" y="108" width="36" height="26" rx="4"/><rect x="248" y="108" width="36" height="26" rx="4"/><rect x="8" y="158" width="36" height="26" rx="4"/><rect x="68" y="158" width="36" height="26" rx="4"/><rect x="188" y="158" width="36" height="26" rx="4"/><rect x="248" y="158" width="36" height="26" rx="4"/></g>
    <g fill="#48A9C5"><circle cx="146" cy="21" r="10"/><circle cx="266" cy="71" r="10"/><circle cx="26" cy="121" r="10"/><circle cx="206" cy="121" r="10"/><circle cx="146" cy="171" r="10"/></g>
  </g>
  <g transform="translate(420 190)">
    <text x="0" y="0" fill="#434544" font-family="Arial" font-size="18" font-weight="700">Candidate threshold</text>
    <line x1="0" y1="52" x2="300" y2="52" stroke="#B5DDE8" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="52" x2="165" y2="52" stroke="#2A6576" stroke-width="10" stroke-linecap="round"/>
    <circle cx="165" cy="52" r="17" fill="#fff" stroke="#2A6576" stroke-width="5"/>
    <text x="0" y="95" fill="#707372" font-family="Arial" font-size="15">stricter</text><text x="245" y="95" fill="#707372" font-family="Arial" font-size="15">looser</text>
    <rect x="0" y="128" width="300" height="58" rx="12" fill="#fff" stroke="#A3D9AC" stroke-width="2"/>
    <text x="150" y="163" text-anchor="middle" fill="#1E5D28" font-family="Arial" font-size="16" font-weight="700">Test sensitivity of conclusions</text>
  </g>
</svg>
